<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS Hermann Gmeiner School Gandaki - Attendance Display</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:"Segoe UI",Arial,sans-serif;
    background:#eaf5fc;
    color:#1a2a3a
}

body{
    overflow:hidden
}

.window{
    width:100%;
    height:100vh;
    padding:15px 20px;
    display:flex;
    flex-direction:column;
    gap:15px
}

.header-card{
    min-height:95px;
    width:100%;
    background:#fff;
    border:1px solid #cbe3f5;
    border-radius:10px;
    padding:10px;
    display:flex;
    align-items:center
}

.logo-wrap{
    width:50px;
    min-width:50px;
    height:50px;
    margin-right:10px;
    display:flex;
    align-items:center;
    justify-content:center
}

.logo{
    width:50px;
    height:50px;
    object-fit:contain
}

.title-wrap{
    display:flex;
    flex-direction:column
}

.title{
    color:#004080;
    font-size:15px;
    font-weight:700
}

.date{
    color:#555;
    font-size:10px;
    margin-top:3px
}

.spacer{
    flex:1
}

.date-controls{
    display:flex;
    align-items:center;
    gap:8px
}

.date-controls label{
    color:#004080;
    font-size:10px;
    font-weight:700
}

.date-picker{
    width:145px;
    height:35px;
    border:1px solid #b2d4ee;
    border-radius:6px;
    padding:0 8px;
    background:#fff;
    font-weight:700
}

.fetch{
    width:70px;
    height:35px;
    border:0;
    border-radius:6px;
    color:#fff;
    background:#0077c8;
    font-weight:700;
    cursor:pointer
}

.fetch:hover{
    background:#005a9e
}

.fetch:disabled{
    opacity:.65;
    cursor:default
}

.back{
    width:160px;
    height:35px;
    margin-left:15px;
    border-radius:6px;
    border:1px solid #b2d4ee;
    color:#0066b2;
    background:#e1f0fa;
    font-weight:700;
    cursor:pointer
}

.back:hover{
    background:#0077c8;
    color:#fff
}

.stats{
    display:flex;
    gap:10px
}

.stat{
    flex:1;
    min-height:75px;
    background:#fff;
    border-radius:8px;
    border-top:1px solid #cbe3f5;
    border-right:1px solid #cbe3f5;
    border-bottom:1px solid #cbe3f5;
    padding:8px 15px;
    display:flex;
    flex-direction:column;
    justify-content:center
}

.stat.total{
    border-left:5px solid #0077c8
}

.stat.present{
    border-left:5px solid #27ae60
}

.stat.absent{
    border-left:5px solid #e74c3c
}

.stat-title{
    color:#7f8c8d;
    font-size:9px;
    font-weight:700
}

.stat-value{
    font-size:16px;
    font-weight:700
}

.total .stat-value{
    color:#0077c8
}

.present .stat-value{
    color:#27ae60
}

.absent .stat-value{
    color:#e74c3c
}

.table-wrap{
    flex:1;
    min-height:0;
    overflow:auto;
    background:#fff;
    border:1px solid #cbe3f5;
    border-radius:8px
}

table{
    width:100%;
    min-width:700px;
    background:#fff;
    border-collapse:collapse
}

th{
    background:#0077c8;
    color:#fff;
    padding:8px;
    font-weight:700;
    position:sticky;
    top:0;
    z-index:2
}

td{
    background:#fff;
    padding:8px;
    border-top:1px solid #e1f0fa
}

.present-status{
    color:#27ae60;
    font-weight:700
}

.absent-status{
    color:#e74c3c;
    font-weight:700
}

.not-marked-status{
    color:#7f8c8d;
    font-style:italic
}

.holiday-status{
    color:#8e44ad;
    font-weight:700
}

.message{
    display:none;
    position:fixed;
    left:50%;
    top:60px;
    transform:translateX(-50%);
    z-index:10;
    padding:10px 14px;
    border-radius:6px;
    font-size:12px;
    font-weight:700;
    max-width:85vw;
    white-space:pre-wrap
}

.message.show{
    display:block
}

.message.error{
    background:#fff0f0;
    color:#9b2c2c;
    border:1px solid #e2a5a5
}

@media(max-width:950px){

    .header-card{
        flex-wrap:wrap
    }

    .spacer{
        display:none
    }

    .date-controls{
        width:100%;
        justify-content:flex-end
    }
}
</style>
</head>

<body>

<main class="window">

<section class="header-card">

<div class="logo-wrap">

<img
    src="logo.png"
    class="logo"
    alt="School Logo"
    onerror="this.style.visibility='hidden'"
>

</div>


<div class="title-wrap">

<div
    id="title"
    class="title"
></div>

<div
    id="dateText"
    class="date"
></div>

</div>


<div class="spacer"></div>


<div class="date-controls">

<label for="datePicker">
📅 Select Date:
</label>

<input
    id="datePicker"
    type="date"
    class="date-picker"
>

<button
    id="fetchButton"
    class="fetch"
>
Fetch
</button>

</div>


<button
    id="backButton"
    class="back"
>
⬅️ Back to Admin Panel
</button>

</section>


<section class="stats">

<div class="stat total">

<div class="stat-title">
Total Students
</div>

<div
    id="total"
    class="stat-value"
>
0
</div>

</div>


<div class="stat present">

<div class="stat-title">
Present
</div>

<div
    id="present"
    class="stat-value"
>
0
</div>

</div>


<div class="stat absent">

<div class="stat-title">
Absent
</div>

<div
    id="absent"
    class="stat-value"
>
0
</div>

</div>

</section>


<div
    id="message"
    class="message"
></div>


<section class="table-wrap">

<table>

<thead>

<tr>

<th>
Student ID
</th>

<th>
Student Name
</th>

<th>
Status
</th>

<th>
Time Marked
</th>

</tr>

</thead>

<tbody
    id="attendanceBody"
>
</tbody>

</table>

</section>

</main>


<script>

/* =========================================================
   API
   ========================================================= */

const API_BASE =
    window.ADMIN_API_BASE ||
    localStorage.getItem(
        "ADMIN_API_BASE"
    ) ||
    (
        window.location.protocol === "http:" ||
        window.location.protocol === "https:"
            ? window.location.origin
            : "http://127.0.0.1:8000"
    );


/* =========================================================
   SUPABASE FALLBACK
   ========================================================= */

const SUPABASE_URL =
    "https://bnhpestcxuisikkbhwkc.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_LjCEE0ik3tcJBPpPqcESPw_31ImMTle";

const SUPABASE_REST_HEADERS = {

    "apikey":
        SUPABASE_KEY,

    "Authorization":
        "Bearer " + SUPABASE_KEY
};


/* =========================================================
   URL PARAMETERS
   ========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const selectedClass =
    params.get("class") ||
    "Class 6";


const selectedSection =
    params.get("section") ||
    "Section A";


const classNumber =
    selectedClass
        .replace(
            /^Class\s+/i,
            ""
        )
        .trim();


const section =
    selectedSection
        .replace(
            /^Section\s+/i,
            ""
        )
        .trim()
        .toUpperCase();


/* =========================================================
   DOM
   ========================================================= */

const title =
    document.getElementById(
        "title"
    );


const dateText =
    document.getElementById(
        "dateText"
    );


const datePicker =
    document.getElementById(
        "datePicker"
    );


const fetchButton =
    document.getElementById(
        "fetchButton"
    );


const total =
    document.getElementById(
        "total"
    );


const present =
    document.getElementById(
        "present"
    );


const absent =
    document.getElementById(
        "absent"
    );


const attendanceBody =
    document.getElementById(
        "attendanceBody"
    );


const message =
    document.getElementById(
        "message"
    );


/* =========================================================
   NEPAL DATE
   ========================================================= */

function getNepalToday(){

    const parts =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone:
                    "Asia/Kathmandu",

                year:
                    "numeric",

                month:
                    "2-digit",

                day:
                    "2-digit"
            }
        ).formatToParts(
            new Date()
        );


    const values = {};


    parts.forEach(
        part => {

            if(
                part.type !== "literal"
            ){

                values[
                    part.type
                ] =
                    part.value;
            }

        }
    );


    return (
        `${values.year}-${values.month}-${values.day}`
    );
}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        character => ({

            "&":
                "&amp;",

            "<":
                "&lt;",

            ">":
                "&gt;",

            '"':
                "&quot;",

            "'":
                "&#39;"

        }[character])
    );
}


/* =========================================================
   ERROR
   ========================================================= */

function showError(
    text
){

    message.textContent =
        text;

    message.className =
        "message show error";


    setTimeout(
        () => {

            message.className =
                "message";

        },
        5000
    );
}


/* =========================================================
   STATUS CLASS
   ========================================================= */

function statusClass(
    status
){

    const normalized =
        String(
            status || ""
        )
        .trim()
        .toUpperCase();


    if(
        normalized ===
        "PRESENT"
    ){

        return "present-status";
    }


    if(
        normalized ===
        "ABSENT"
    ){

        return "absent-status";
    }


    if(
        normalized ===
        "HOLIDAY"
    ){

        return "holiday-status";
    }


    return "not-marked-status";
}


/* =========================================================
   RENDER ATTENDANCE
   ========================================================= */

function renderAttendanceData(
    data
){

    const students =
        Array.isArray(
            data.students
        )
            ? data.students
            : [];


    const enrolledTotal =
        students.length;


    const presentTotal =
        students.filter(
            student =>
                String(
                    student.status || ""
                )
                .trim()
                .toUpperCase() ===
                "PRESENT"
        ).length;


    const computedAbsent =
        Math.max(
            enrolledTotal -
            presentTotal,
            0
        );


    data.total_students =
        enrolledTotal;


    data.present_students =
        presentTotal;


    data.absent_students =
        computedAbsent;


    title.textContent =
        `Attendance Register: ` +
        `${selectedClass} - ` +
        `${selectedSection}`;


    if(
        data.holiday
    ){

        title.textContent +=
            " (HOLIDAY)";


        dateText.textContent =
            `Date: ` +
            `${data.date || datePicker.value}` +
            ` - HOLIDAY`;

    }
    else{

        dateText.textContent =
            `Date: ` +
            `${data.date || datePicker.value}`;
    }


    total.textContent =
        String(
            data.total_students ||
            0
        );


    present.textContent =
        String(
            data.present_students ||
            0
        );


    absent.textContent =
        String(
            data.absent_students ||
            0
        );


    attendanceBody.innerHTML =
        "";


    if(
        students.length ===
        0
    ){

        attendanceBody.innerHTML =
            `
            <tr>

                <td
                    colspan="4"
                    style="
                        text-align:center;
                        color:#64748b;
                        padding:20px;
                    "
                >
                    No students found for
                    ${escapeHTML(selectedClass)}
                    -
                    ${escapeHTML(selectedSection)}
                    on
                    ${escapeHTML(
                        data.date ||
                        datePicker.value
                    )}.
                </td>

            </tr>
            `;

        return;
    }


    students.forEach(
        student => {

            const status =
                String(
                    student.status ||
                    "Not Marked"
                );


            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML =
                `
                <td>
                    ${escapeHTML(
                        student.student_id
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        student.name
                    )}
                </td>

                <td
                    class="${statusClass(status)}"
                >
                    ${escapeHTML(status)}
                </td>

                <td>
                    ${escapeHTML(
                        student.time_marked ||
                        "-"
                    )}
                </td>
                `;


            attendanceBody.appendChild(
                row
            );

        }
    );
}


/* =========================================================
   DIRECT SUPABASE FALLBACK
   ========================================================= */

async function loadAttendanceDirectFromSupabase(
    selectedDate
){

    const studentsUrl =
        SUPABASE_URL +
        "/rest/v1/students" +
        "?select=student_id,name,class_number,section" +
        "&class_number=eq." +
        encodeURIComponent(
            classNumber
        ) +
        "&section=eq." +
        encodeURIComponent(
            section
        ) +
        "&order=student_id.asc";


    const attendanceUrl =
        SUPABASE_URL +
        "/rest/v1/attendance" +
        "?select=student_id,name,status,attendance_time,attendance_date,class_number,section" +
        "&class_number=eq." +
        encodeURIComponent(
            classNumber
        ) +
        "&section=eq." +
        encodeURIComponent(
            section
        ) +
        "&attendance_date=eq." +
        encodeURIComponent(
            selectedDate
        ) +
        "&order=student_id.asc";


    const [
        studentsResponse,
        attendanceResponse
    ] =
        await Promise.all(
            [

                fetch(
                    studentsUrl,
                    {
                        headers:
                            SUPABASE_REST_HEADERS,

                        cache:
                            "no-store"
                    }
                ),

                fetch(
                    attendanceUrl,
                    {
                        headers:
                            SUPABASE_REST_HEADERS,

                        cache:
                            "no-store"
                    }
                )

            ]
        );


    const studentsText =
        await studentsResponse.text();


    const attendanceText =
        await attendanceResponse.text();


    let studentsData = [];

    let attendanceData = [];


    try{

        studentsData =
            studentsText
                ? JSON.parse(
                    studentsText
                )
                : [];

    }
    catch{

        throw new Error(
            "Supabase students response was not valid JSON."
        );

    }


    try{

        attendanceData =
            attendanceText
                ? JSON.parse(
                    attendanceText
                )
                : [];

    }
    catch{

        throw new Error(
            "Supabase attendance response was not valid JSON."
        );

    }


    if(
        !studentsResponse.ok
    ){

        throw new Error(
            "Supabase students query failed: " +
            JSON.stringify(
                studentsData
            )
        );

    }


    if(
        !attendanceResponse.ok
    ){

        throw new Error(
            "Supabase attendance query failed: " +
            JSON.stringify(
                attendanceData
            )
        );

    }


    const attendanceByStudent =
        new Map();


    for(
        const record
        of attendanceData
    ){

        const studentId =
            String(
                record.student_id ||
                ""
            )
            .trim()
            .toUpperCase();


        if(
            !studentId
        ){

            continue;
        }


        attendanceByStudent.set(
            studentId,
            record
        );

    }


    const totalStudents =
        studentsData.length;


    let presentCount =
        0;


    const displayStudents =
        studentsData.map(
            student => {

                const studentId =
                    String(
                        student.student_id ||
                        ""
                    )
                    .trim()
                    .toUpperCase();


                const attendanceRecord =
                    attendanceByStudent.get(
                        studentId
                    );


                const status =
                    attendanceRecord &&
                    String(
                        attendanceRecord.status ||
                        ""
                    )
                    .trim()
                    .toUpperCase();


                if(
                    status ===
                    "PRESENT"
                ){

                    presentCount +=
                        1;


                    return {

                        student_id:
                            studentId,

                        name:
                            String(
                                student.name ||
                                attendanceRecord.name ||
                                ""
                            ).trim(),

                        status:
                            "Present",

                        time_marked:
                            String(
                                attendanceRecord.attendance_time ||
                                "-"
                            )

                    };

                }


                return {

                    student_id:
                        studentId,

                    name:
                        String(
                            student.name ||
                            ""
                        ).trim(),

                    status:
                        "Absent",

                    time_marked:
                        attendanceRecord &&
                        attendanceRecord.attendance_time
                            ? String(
                                attendanceRecord.attendance_time
                            )
                            : "-"

                };

            }
        );


    const absentCount =
        Math.max(
            totalStudents -
            presentCount,
            0
        );


    return {

        date:
            selectedDate,

        class_number:
            classNumber,

        section:
            section,

        holiday:
            false,

        total_students:
            totalStudents,

        present_students:
            presentCount,

        absent_students:
            absentCount,

        students:
            displayStudents
    };
}


/* =========================================================
   LOAD ATTENDANCE
   ========================================================= */

async function loadAttendance(){

    fetchButton.disabled =
        true;


    fetchButton.textContent =
        "Loading...";


    try{

        const selectedDate =
            datePicker.value;


        const url =
            API_BASE +
            "/api/attendance/display" +
            "?class_number=" +
            encodeURIComponent(
                classNumber
            ) +
            "&section=" +
            encodeURIComponent(
                section
            ) +
            "&attendance_date=" +
            encodeURIComponent(
                selectedDate
            ) +
            "&_=" +
            Date.now();


        let response =
            await fetch(
                url,
                {
                    method:
                        "GET",

                    cache:
                        "no-store"
                }
            );


        /*
         * Keep compatibility with the older endpoint.
         */

        if(
            response.status ===
            404
        ){

            const fallbackUrl =
                API_BASE +
                "/api/admin/attendance" +
                "?class_number=" +
                encodeURIComponent(
                    classNumber
                ) +
                "&section=" +
                encodeURIComponent(
                    section
                ) +
                "&attendance_date=" +
                encodeURIComponent(
                    selectedDate
                ) +
                "&_=" +
                Date.now();


            response =
                await fetch(
                    fallbackUrl,
                    {
                        method:
                            "GET",

                        cache:
                            "no-store"
                    }
                );
        }


        /*
         * Direct Supabase fallback.
         */

        if(
            response.status ===
            404
        ){

            const directData =
                await loadAttendanceDirectFromSupabase(
                    selectedDate
                );


            renderAttendanceData(
                directData
            );


            return;
        }


        const text =
            await response.text();


        let result = {};


        try{

            result =
                text
                    ? JSON.parse(
                        text
                    )
                    : {};

        }
        catch{

            result = {

                detail:
                    text

            };

        }


        if(
            !response.ok
        ){

            let detail =
                result.detail ||
                result.message ||
                result;


            if(
                typeof detail !==
                "string"
            ){

                detail =
                    JSON.stringify(
                        detail,
                        null,
                        2
                    );
            }


            throw new Error(
                detail
            );
        }


        /*
         * FIX:
         *
         * The previous version used:
         *
         *     renderAttendanceData(data)
         *
         * but "data" was never defined.
         *
         * We now correctly use the API response.
         */

        const data =
            result &&
            result.data !==
                undefined
                ? result.data
                : result;


        renderAttendanceData(
            data
        );

    }
    catch(
        error
    ){

        showError(
            "Attendance could not be loaded.\n\n" +
            (
                error.message ||
                String(error)
            )
        );

    }
    finally{

        fetchButton.disabled =
            false;


        fetchButton.textContent =
            "Fetch";
    }
}


/* =========================================================
   INITIALIZE
   ========================================================= */

datePicker.value =
    getNepalToday();


title.textContent =
    `Attendance Register: ` +
    `${selectedClass} - ` +
    `${selectedSection}`;


/* =========================================================
   FETCH
   ========================================================= */

fetchButton.onclick =
    loadAttendance;


datePicker.onchange =
    loadAttendance;


/* =========================================================
   BACK TO ADMIN
   ========================================================= */

document.getElementById(
    "backButton"
).onclick =
    () => {

        /*
         * Preserve the exact class and section when returning.
         */

        const returnUrl =
            "admin_panel.html" +
            "?class=" +
            encodeURIComponent(
                selectedClass
            ) +
            "&section=" +
            encodeURIComponent(
                selectedSection
            );


        window.location.assign(
            returnUrl
        );
    };


/* =========================================================
   FIRST LOAD
   ========================================================= */

loadAttendance();


/* =========================================================
   LIVE REFRESH
   ========================================================= */

setInterval(
    loadAttendance,
    3000
);

</script>

</body>
</html>
