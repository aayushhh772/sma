<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS Hermann Gmeiner School Gandaki</title>
<style>
    :root {
        --blue-dark: #0369A1;
        --blue: #0284C7;
        --blue-deep: #075985;
        --cyan-border: #BAE6FD;
        --slate: #64748B;
        --muted: #94A3B8;
        --text: #0F172A;
        --danger: #E11D48;
        --danger-hover: #BE123C;
    }

    * {
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
    }

    body {
        min-width: 600px;
        min-height: 300px;
        overflow: hidden;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #EBF8FE;
        color: var(--text);
    }

    #app {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 300px;
        overflow: hidden;
    }

    .page {
        position: absolute;
        inset: 0;
        display: none;
        width: 100%;
        height: 100%;
    }

    .page.active {
        display: flex;
    }

    canvas.background {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 0;
    }

    .page-content {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        padding: 15px 50px 30px;
        display: flex;
        flex-direction: column;
    }

    .page-login .page-content {
        padding-bottom: 25px;
    }

    .header-row {
        width: 100%;
        min-height: 22px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        flex: 0 0 auto;
    }

    .time-label {
        color: var(--blue-dark);
        font-size: 11px;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
    }

    .spacer {
        flex: 1 1 auto;
    }

    .selection-center,
    .login-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
    }

    .selection-center {
        margin-top: 0;
        margin-bottom: 0;
    }

    .logo-wrap {
        width: 135px;
        height: 135px;
        border-radius: 22px;
        overflow: hidden;
        background: transparent;
        display: flex;
        justify-content: center;
        align-items: center;
        flex: 0 0 auto;
    }

    .logo-wrap img {
        width: 135px;
        height: 135px;
        object-fit: contain;
        display: block;
        border-radius: 22px;
    }

    .school-title {
        margin: 18px 0 0;
        color: var(--blue-dark);
        font-size: 27px;
        font-weight: 700;
        line-height: 1.15;
        text-align: center;
    }

    .typing-subtitle {
        height: 40px;
        margin-top: 7px;
        color: var(--slate);
        font-size: 17px;
        font-weight: 400;
        line-height: 40px;
        text-align: center;
        white-space: pre;
    }

    .portal-area {
        width: 420px;
        max-width: 90vw;
        height: 125px;
        margin-top: 28px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .portal-button {
        position: relative;
        width: 380px;
        height: 125px;
        padding: 0;
        border: 0;
        border-radius: 18px;
        background: transparent;
        cursor: pointer;
        outline: none;
        font-family: "Segoe UI", Arial, sans-serif;
        transition: transform 0.18s ease;
    }

    .portal-button-inner {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 350px;
        height: 115px;
        transform: translate(-50%, -50%);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.949);
        border: 1px solid #BAE6FD;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition:
            width 0.18s cubic-bezier(.2,.8,.2,1),
            height 0.18s cubic-bezier(.2,.8,.2,1),
            background-color 0.18s ease,
            border-color 0.18s ease,
            box-shadow 0.18s ease;
    }

    .portal-button:hover .portal-button-inner,
    .portal-button.hovering .portal-button-inner {
        width: 380px;
        height: 125px;
        background: rgba(7, 89, 133, 1);
        border-color: rgba(7, 89, 133, 1);
        box-shadow: 0 10px 28px rgba(7, 89, 133, 0.15);
    }

    .portal-title {
        color: var(--blue-dark);
        font-size: 17px;
        font-weight: 600;
        line-height: 35px;
        transition: color 0.18s ease;
    }

    .portal-subtitle {
        color: #64748B;
        font-size: 11px;
        font-weight: 400;
        line-height: 25px;
        transition: color 0.18s ease;
    }

    .portal-button:hover .portal-title,
    .portal-button.hovering .portal-title {
        color: #FFFFFF;
    }

    .portal-button:hover .portal-subtitle,
    .portal-button.hovering .portal-subtitle {
        color: #DCEFF8;
    }

    .selection-info {
        margin-top: 45px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 400;
        line-height: 1.2;
        text-align: center;
    }

    .login-title {
        margin: 0;
        color: var(--blue-dark);
        font-size: 32px;
        font-weight: 700;
        line-height: 1.15;
        text-align: center;
    }

    .login-subtitle {
        margin-top: 7px;
        color: var(--slate);
        font-size: 15px;
        font-weight: 400;
        line-height: 1.2;
        text-align: center;
    }

    .login-card {
        width: 700px;
        max-width: min(700px, 92vw);
        margin-top: 15px;
        padding: 20px 50px;
        background: rgba(255, 255, 255, 0.949);
        border: 1px solid var(--cyan-border);
        border-radius: 22px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        box-shadow: 0 8px 26px rgba(56, 189, 248, 0.06);
    }

    .field-label {
        color: var(--text);
        font-size: 11px;
        font-weight: 600;
        line-height: 1.3;
    }

    .text-input {
        width: 100%;
        height: 45px;
        border: 1px solid var(--cyan-border);
        border-radius: 10px;
        outline: none;
        background: #FFFFFF;
        color: var(--text);
        padding: 0 16px;
        font-family: "Segoe UI", Arial, sans-serif;
        font-size: 15px;
        transition: border 0.12s ease, box-shadow 0.12s ease;
    }

    .text-input::placeholder {
        color: #94A3B8;
    }

    .text-input:focus {
        border: 2px solid var(--blue);
    }

    .login-button {
        width: 100%;
        height: 44px;
        margin-top: 2px;
        border: 0;
        border-radius: 10px;
        padding: 8px;
        background: var(--blue);
        color: #FFFFFF;
        font-family: "Segoe UI", Arial, sans-serif;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 0.1s ease, transform 0.08s ease;
    }

    .login-button:hover {
        background: var(--blue-dark);
    }

    .login-button:active {
        background: var(--blue-deep);
        transform: translateY(1px);
    }

    .forgot-button {
        width: 100%;
        height: 28px;
        border: 0;
        background: transparent;
        color: var(--danger);
        font-family: "Segoe UI", Arial, sans-serif;
        font-size: 10px;
        font-weight: 700;
        cursor: pointer;
    }

    .forgot-button:hover {
        color: var(--danger-hover);
        text-decoration: underline;
    }

    .back-button {
        width: 100%;
        height: 38px;
        border: 1px solid var(--cyan-border);
        border-radius: 9px;
        padding: 4px;
        background: transparent;
        color: var(--blue);
        font-family: "Segoe UI", Arial, sans-serif;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 0.1s ease, border-color 0.1s ease, color 0.1s ease;
    }

    .back-button:hover {
        background: #F0F9FF;
        border-color: var(--blue);
        color: var(--blue-dark);
    }

    .back-button:active {
        background: #E0F2FE;
    }

    .school-footer {
        margin-top: 15px;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.2;
        text-align: center;
    }

    .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(15, 23, 42, 0.16);
        backdrop-filter: blur(2px);
    }

    .modal-overlay.visible {
        display: flex;
    }

    .modal {
        width: min(410px, calc(100vw - 40px));
        border: 1px solid var(--cyan-border);
        border-radius: 16px;
        background: #FFFFFF;
        box-shadow: 0 18px 55px rgba(15, 23, 42, 0.18);
        padding: 20px;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    .modal-title {
        margin: 0 0 8px;
        color: #0F172A;
        font-size: 16px;
        font-weight: 700;
    }

    .modal-text {
        margin: 0;
        color: #475569;
        font-size: 13px;
        line-height: 1.45;
        white-space: pre-line;
    }

    .modal-actions {
        margin-top: 16px;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
    }

    .modal-btn {
        min-width: 78px;
        height: 34px;
        border-radius: 8px;
        cursor: pointer;
        font: 600 12px "Segoe UI", Arial, sans-serif;
    }

    .modal-btn.primary {
        border: 0;
        background: var(--blue);
        color: white;
    }

    .modal-btn.secondary {
        border: 1px solid var(--cyan-border);
        background: white;
        color: var(--blue);
    }

    @media (max-width: 760px) {
        body {
            min-width: 0;
        }

        .page-content {
            padding-left: 24px;
            padding-right: 24px;
        }

        .login-card {
            padding-left: 28px;
            padding-right: 28px;
        }

        .portal-area {
            width: 100%;
        }

        .portal-button,
        .portal-button-inner {
            width: min(380px, 90vw);
        }
    }
</style>
</head>
<body>
<div id="app">

    <section id="selectionPage" class="page active">
        <canvas id="selectionCanvas" class="background"></canvas>

        <div class="page-content">
            <div class="header-row">
                <div id="selectionTime" class="time-label"></div>
            </div>

            <div class="spacer"></div>

            <div class="selection-center">
                <div class="logo-wrap">
                    <img src="logo.jpg" alt="School Logo" onerror="this.style.display='none';">
                </div>

                <div class="school-title">SOS Hermann Gmeiner School Gandaki</div>

                <div id="typingSubtitle" class="typing-subtitle"></div>

                <div class="portal-area">
                    <button id="adminPortalButton" class="portal-button" type="button" aria-label="Admin Portal">
                        <span class="portal-button-inner">
                            <span class="portal-title">Admin Portal</span>
                            <span class="portal-subtitle">Login Required</span>
                        </span>
                    </button>
                </div>

                <div class="selection-info">Select portal to continue</div>
            </div>

            <div class="spacer"></div>
        </div>
    </section>

    <section id="loginPage" class="page page-login">
        <canvas id="loginCanvas" class="background"></canvas>

        <div class="page-content">
            <div class="header-row">
                <div id="loginTime" class="time-label"></div>
            </div>

            <div class="spacer"></div>

            <div class="login-center">
                <div class="login-title">Admin Portal</div>
                <div class="login-subtitle">Enter your credentials to continue</div>

                <form id="loginCard" class="login-card" autocomplete="on">
                    <label class="field-label" for="adminId">Admin ID</label>
                    <input id="adminId" class="text-input" type="text" placeholder="Enter your Admin ID" autocomplete="username">

                    <label class="field-label" for="adminPassword">Password</label>
                    <input id="adminPassword" class="text-input" type="password" placeholder="Enter your password" autocomplete="current-password">

                    <button id="loginButton" class="login-button" type="submit">Login</button>
                    <button id="forgotPassword" class="forgot-button" type="button">Forgot password?</button>
                    <button id="backButton" class="back-button" type="button">Back</button>
                </form>

                <div class="school-footer">SOS Hermann Gmeiner School Gandaki</div>
            </div>

            <div class="spacer"></div>
        </div>
    </section>

    <div id="modalOverlay" class="modal-overlay" role="dialog" aria-modal="true">
        <div class="modal">
            <h2 id="modalTitle" class="modal-title"></h2>
            <p id="modalText" class="modal-text"></p>
            <div class="modal-actions">
                <button id="modalSecondary" class="modal-btn secondary" type="button">Close</button>
                <button id="modalPrimary" class="modal-btn primary" type="button">OK</button>
            </div>
        </div>
    </div>
</div>

<audio id="keyboardSound" src="keyboard.mp3" preload="auto"></audio>
<audio id="uiSound" src="ui.wav" preload="auto"></audio>
<audio id="ui1Sound" src="ui1.wav" preload="auto"></audio>

<script>
(() => {
    "use strict";

    const BASE_DIR = "";
    const CREDENTIALS_FILE = "admin_credentials.json";

    const audio = {
        keyboard: document.getElementById("keyboardSound"),
        ui: document.getElementById("uiSound"),
        ui1: document.getElementById("ui1Sound")
    };

    const selectionPage = document.getElementById("selectionPage");
    const loginPage = document.getElementById("loginPage");
    const selectionTime = document.getElementById("selectionTime");
    const loginTime = document.getElementById("loginTime");
    const typingSubtitle = document.getElementById("typingSubtitle");
    const adminId = document.getElementById("adminId");
    const adminPassword = document.getElementById("adminPassword");
    const adminPortalButton = document.getElementById("adminPortalButton");
    const loginCard = document.getElementById("loginCard");
    const forgotPassword = document.getElementById("forgotPassword");
    const backButton = document.getElementById("backButton");

    const modalOverlay = document.getElementById("modalOverlay");
    const modalTitle = document.getElementById("modalTitle");
    const modalText = document.getElementById("modalText");
    const modalPrimary = document.getElementById("modalPrimary");
    const modalSecondary = document.getElementById("modalSecondary");

    let customCredentials = null;
    let typingTimer = null;
    let typingStart = 0;
    let typingStarted = false;

    function safePlay(sound, volume = 1, restart = true) {
        if (!sound) return;
        try {
            sound.volume = volume;
            if (restart) {
                sound.currentTime = 0;
            }
            const promise = sound.play();
            if (promise && typeof promise.catch === "function") {
                promise.catch(() => {});
            }
        } catch (_) {}
    }

    function playClickSound() {
        safePlay(audio.ui1, 0.30, true);
    }

    function updateLiveTime() {
        const now = new Date();
        const day = now.toLocaleDateString("en-US", { weekday: "short" });
        const month = now.toLocaleDateString("en-US", { month: "short" });
        const dayNum = now.getDate();
        const hour = now.getHours();
        const minute = String(now.getMinutes()).padStart(2, "0");
        const hour12 = hour % 12 || 12;
        const ampm = hour >= 12 ? "PM" : "AM";
        const formatted = `${day} ${month} ${dayNum}, ${hour12}:${minute} ${ampm}`;
        const value = `🕒 ${formatted}`;
        selectionTime.textContent = value;
        loginTime.textContent = value;
    }

    function showPage(page) {
        selectionPage.classList.toggle("active", page === "selection");
        loginPage.classList.toggle("active", page === "login");

        if (page === "login") {
            startTypingIfNeeded();
        }
    }

    function showModal(title, text, type = "info") {
        modalTitle.textContent = title;
        modalText.textContent = text;
        modalOverlay.classList.add("visible");

        if (type === "error") {
            modalPrimary.textContent = "OK";
            modalPrimary.style.background = "#E11D48";
        } else if (type === "warning") {
            modalPrimary.textContent = "OK";
            modalPrimary.style.background = "#E11D48";
        } else {
            modalPrimary.textContent = "OK";
            modalPrimary.style.background = "#0284C7";
        }
    }

    function closeModal() {
        modalOverlay.classList.remove("visible");
    }

    async function loadCredentials() {
        try {
            const response = await fetch(CREDENTIALS_FILE, { cache: "no-store" });
            if (!response.ok) return;
            const data = await response.json();

            if (
                data &&
                typeof data.admin_id === "string" &&
                typeof data.password === "string"
            ) {
                customCredentials = {
                    admin_id: data.admin_id,
                    password: data.password
                };
            }
        } catch (_) {
            customCredentials = null;
        }
    }

    function validateCredentials(enteredId, enteredPassword) {
        if (enteredId === "SOSADMIN1" && enteredPassword === "ADMIN404") {
            return true;
        }

        if (
            customCredentials &&
            enteredId === customCredentials.admin_id &&
            enteredPassword === customCredentials.password
        ) {
            return true;
        }

        return false;
    }

    function openAdminPanel() {
        window.location.href = "admin_panel.html";
    }

    function login() {
        const username = adminId.value.trim();
        const password = adminPassword.value.trim();

        if (!username || !password) {
            showModal(
                "Login Error",
                "Please enter both Admin ID and Password.",
                "warning"
            );
            return;
        }

        if (validateCredentials(username, password)) {
            playClickSound();
            adminId.value = "";
            adminPassword.value = "";
            openAdminPanel();
        } else {
            showModal(
                "Login Error",
                "Invalid Admin ID or Password.",
                "error"
            );
        }
    }

    function forgotPasswordAction() {
        playClickSound();
        showModal(
            "Forgot Password",
            "CONTACT THE DEVELOPERS !!!",
            "info"
        );
    }

    function startTypingIfNeeded() {
        if (typingStarted) return;
        typingStarted = true;

        window.setTimeout(() => {
            const text = "Admin Management Portal";
            typingStart = performance.now();

            safePlay(audio.keyboard, 0.65, true);

            if (typingTimer) {
                cancelAnimationFrame(typingTimer);
            }

            const updateTyping = (time) => {
                const elapsed = Math.min(time - typingStart, 1500);
                const count = Math.floor(text.length * elapsed / 1500);
                typingSubtitle.textContent = text.slice(0, count);

                if (elapsed >= 1500) {
                    typingSubtitle.textContent = text;
                    typingTimer = null;
                    return;
                }

                typingTimer = requestAnimationFrame(updateTyping);
            };

            typingTimer = requestAnimationFrame(updateTyping);
        }, 1000);
    }

    function attachHoverSound() {
        let hoverTimeout = null;

        adminPortalButton.addEventListener("mouseenter", () => {
            adminPortalButton.classList.add("hovering");

            if (hoverTimeout) {
                clearTimeout(hoverTimeout);
            }

            try {
                if (audio.ui) {
                    audio.ui.pause();
                    audio.ui.currentTime = 0;
                    audio.ui.volume = 0.16;
                    const promise = audio.ui.play();
                    if (promise && typeof promise.catch === "function") {
                        promise.catch(() => {});
                    }

                    hoverTimeout = setTimeout(() => {
                        const started = performance.now();
                        const fade = () => {
                            const progress = Math.min((performance.now() - started) / 200, 1);
                            if (audio.ui) {
                                audio.ui.volume = 0.16 * (1 - progress);
                            }
                            if (progress < 1) {
                                requestAnimationFrame(fade);
                            } else {
                                try {
                                    audio.ui.pause();
                                    audio.ui.currentTime = 0;
                                    audio.ui.volume = 0;
                                } catch (_) {}
                            }
                        };
                        requestAnimationFrame(fade);
                    }, 800);
                }
            } catch (_) {}
        });

        adminPortalButton.addEventListener("mouseleave", () => {
            adminPortalButton.classList.remove("hovering");
            if (hoverTimeout) {
                clearTimeout(hoverTimeout);
                hoverTimeout = null;
            }
            try {
                audio.ui.pause();
                audio.ui.currentTime = 0;
                audio.ui.volume = 0;
            } catch (_) {}
        });
    }

    adminPortalButton.addEventListener("click", () => {
        playClickSound();
        showPage("login");
    });

    loginCard.addEventListener("submit", (event) => {
        event.preventDefault();
        playClickSound();
        login();
    });

    forgotPassword.addEventListener("click", forgotPasswordAction);

    backButton.addEventListener("click", () => {
        playClickSound();
        showPage("selection");
    });

    modalPrimary.addEventListener("click", closeModal);
    modalSecondary.addEventListener("click", closeModal);

    modalOverlay.addEventListener("click", (event) => {
        if (event.target === modalOverlay) {
            closeModal();
        }
    });

    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && modalOverlay.classList.contains("visible")) {
            closeModal();
        }
    });

    attachHoverSound();
    updateLiveTime();
    setInterval(updateLiveTime, 1000);
    loadCredentials();
    startTypingIfNeeded();
})();

class AnimatedBackground {
    constructor(canvas, intensity = 1.0) {
        this.canvas = canvas;
        this.ctx = canvas.getContext("2d");
        this.intensity = intensity;
        this.phase = 0;
        this.bubbles = [];
        this.lastWidth = 0;
        this.lastHeight = 0;

        this.resize = this.resize.bind(this);
        this.animate = this.animate.bind(this);

        window.addEventListener("resize", this.resize);
        this.resize();
        requestAnimationFrame(this.animate);
    }

    randomBubble(randomPosition = true) {
        const width = Math.max(this.canvas.width / (window.devicePixelRatio || 1), 1);
        const height = Math.max(this.canvas.height / (window.devicePixelRatio || 1), 1);

        return {
            radius: Math.random() * (24 - 5) + 5,
            x: Math.random() * width,
            y: randomPosition
                ? Math.random() * height
                : height + 20 + 24,
            speed: Math.random() * (0.55 - 0.18) + 0.18,
            phase: Math.random() * Math.PI * 2,
            wobble: Math.random() * (0.55 - 0.15) + 0.15,
            alpha: Math.floor(Math.random() * (65 - 22 + 1)) + 22
        };
    }

    resize() {
        const rect = this.canvas.getBoundingClientRect();
        const dpr = Math.max(window.devicePixelRatio || 1, 1);

        const width = Math.max(rect.width, 1);
        const height = Math.max(rect.height, 1);

        this.canvas.width = Math.floor(width * dpr);
        this.canvas.height = Math.floor(height * dpr);

        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (width !== this.lastWidth || height !== this.lastHeight) {
            const count = Math.floor(55 * this.intensity);

            if (this.bubbles.length === 0) {
                this.bubbles = Array.from({ length: count }, () => this.randomBubble(true));
            } else {
                while (this.bubbles.length < count) {
                    this.bubbles.push(this.randomBubble(true));
                }
                if (this.bubbles.length > count) {
                    this.bubbles.length = count;
                }
            }

            this.lastWidth = width;
            this.lastHeight = height;
        }
    }

    animate() {
        const width = Math.max(this.canvas.clientWidth, 1);
        const height = Math.max(this.canvas.clientHeight, 1);

        this.phase += 0.010;

        for (const bubble of this.bubbles) {
            bubble.y -= bubble.speed;
            bubble.phase += 0.018;
            bubble.x += Math.sin(bubble.phase) * bubble.wobble;

            if (bubble.y < -bubble.radius * 2) {
                Object.assign(bubble, this.randomBubble(false));
            }
        }

        this.draw(width, height);
        requestAnimationFrame(this.animate);
    }

    draw(width, height) {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, width, height);

        const background = ctx.createLinearGradient(0, 0, 0, height);
        background.addColorStop(0.0, "#A8DDF5");
        background.addColorStop(0.20, "#CBEDFA");
        background.addColorStop(0.48, "#EBF8FD");
        background.addColorStop(0.78, "#F2FAFD");
        background.addColorStop(1.0, "#B8E5F8");
        ctx.fillStyle = background;
        ctx.fillRect(0, 0, width, height);

        const glow = ctx.createRadialGradient(
            width * 0.5,
            height * 0.45,
            0,
            width * 0.5,
            height * 0.45,
            width * 0.70
        );
        glow.addColorStop(0.0, `rgba(255,255,255,${145 * this.intensity / 255})`);
        glow.addColorStop(0.45, `rgba(255,255,255,${60 * this.intensity / 255})`);
        glow.addColorStop(1.0, "rgba(255,255,255,0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, width, height);

        const topWave = new Path2D();
        topWave.moveTo(0, 0);
        topWave.lineTo(0, 175);
        topWave.bezierCurveTo(
            width * 0.18,
            215 + Math.sin(this.phase) * 10,
            width * 0.43,
            125 + Math.cos(this.phase) * 12,
            width * 0.68,
            155 + Math.sin(this.phase + 1) * 10
        );
        topWave.bezierCurveTo(
            width * 0.83,
            175 + Math.cos(this.phase) * 10,
            width * 0.92,
            145 + Math.sin(this.phase + 8),
            width,
            180
        );
        topWave.lineTo(width, 0);
        topWave.closePath();

        const topGradient = ctx.createLinearGradient(0, 0, width, 200);
        topGradient.addColorStop(0.0, `rgba(14,165,233,${65 * this.intensity / 255})`);
        topGradient.addColorStop(0.5, `rgba(56,189,248,${42 * this.intensity / 255})`);
        topGradient.addColorStop(1.0, `rgba(125,211,252,${18 * this.intensity / 255})`);
        ctx.fillStyle = topGradient;
        ctx.fill(topWave);

        const centerGlow = ctx.createRadialGradient(
            width * 0.5,
            height * 0.56,
            0,
            width * 0.5,
            height * 0.56,
            Math.min(width, height) * 0.45
        );
        centerGlow.addColorStop(0.0, `rgba(186,230,253,${42 * this.intensity / 255})`);
        centerGlow.addColorStop(0.45, `rgba(186,230,253,${22 * this.intensity / 255})`);
        centerGlow.addColorStop(1.0, "rgba(186,230,253,0)");
        ctx.fillStyle = centerGlow;
        ctx.fillRect(0, 0, width, height);

        const bottomWave = new Path2D();
        bottomWave.moveTo(0, height);
        bottomWave.lineTo(0, height - 105);
        bottomWave.bezierCurveTo(
            width * 0.20,
            height - 145,
            width * 0.43,
            height - 65,
            width * 0.67,
            height - 100
        );
        bottomWave.bezierCurveTo(
            width * 0.83,
            height - 125,
            width * 0.93,
            height - 80,
            width,
            height - 110
        );
        bottomWave.lineTo(width, height);
        bottomWave.closePath();

        const bottomGradient = ctx.createLinearGradient(
            0,
            height - 160,
            width,
            height
        );
        bottomGradient.addColorStop(
            0.0,
            `rgba(56,189,248,${18 * this.intensity / 255})`
        );
        bottomGradient.addColorStop(
            1.0,
            `rgba(14,165,233,${55 * this.intensity / 255})`
        );
        ctx.fillStyle = bottomGradient;
        ctx.fill(bottomWave);

        for (const bubble of this.bubbles) {
            const alpha = bubble.alpha * this.intensity;
            const gradient = ctx.createRadialGradient(
                bubble.x,
                bubble.y,
                0,
                bubble.x,
                bubble.y,
                bubble.radius
            );

            gradient.addColorStop(
                0.0,
                `rgba(255,255,255,${alpha * 0.9 / 255})`
            );
            gradient.addColorStop(
                0.35,
                `rgba(125,211,252,${alpha * 0.75 / 255})`
            );
            gradient.addColorStop(
                0.75,
                `rgba(56,189,248,${alpha * 0.30 / 255})`
            );
            gradient.addColorStop(
                1.0,
                "rgba(56,189,248,0)"
            );

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(
                bubble.x,
                bubble.y,
                bubble.radius,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }
    }
}

new AnimatedBackground(document.getElementById("selectionCanvas"), 1.0);
new AnimatedBackground(document.getElementById("loginCanvas"), 0.55);
</script>
